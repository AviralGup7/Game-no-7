<text x="1040" y="207" fill="#65d9ed" font-size="13" letter-spacing="2">MISSION LOG</text>
<text x="1040" y="251" fill="#f4cf7a" font-size="16">01</text>
<text x="1080" y="251" class="white" font-size="16" font-weight="700">A signal in the dark</text>
<text x="1080" y="272" class="muted" font-size="13">Find the dock relay. Reconnect it to</text>
<text x="1080" y="293" class="muted" font-size="13">learn what happened to Station Zero.</text>
<text x="1040" y="330" fill="#f4cf7a" font-size="16">02</text>
<text x="1080" y="330" class="white" font-size="16" font-weight="700">Bring the grid online</text>
<text x="1080" y="351" class="muted" font-size="13">Travel to Transit Works, secure its</text>
<text x="1080" y="372" class="muted" font-size="13">generator crew and restore station</text>
<text x="1080" y="393" class="muted" font-size="13">power.</text>
<text x="1040" y="430" fill="#f4cf7a" font-size="16">03</text>
<text x="1080" y="430" class="white" font-size="16" font-weight="700">Names, not numbers</text>
<text x="1080" y="451" class="muted" font-size="13">Search Cargo Exchange for all three</text>
<text x="1080" y="472" class="muted" font-size="13">evacuation manifests. The survivors</text>
<text x="1080" y="493" class="muted" font-size="13">need a route home.</text>
<text x="1040" y="530" fill="#f4cf7a" font-size="16">04</text>
<text x="1080" y="530" class="white" font-size="16" font-weight="700">Stop the cascade</text>
<text x="1080" y="551" class="muted" font-size="13">Cross the eastern service causeway.</text>
<text x="1080" y="572" class="muted" font-size="13">Defeat the coolant wardens and</text>
<text x="1080" y="593" class="muted" font-size="13">disable the reactor override.</text>
<text x="1040" y="630" fill="#f4cf7a" font-size="16">05</text>
<text x="1080" y="630" class="white" font-size="16" font-weight="700">Open the lifeline</text>
<text x="1080" y="651" class="muted" font-size="13">Reach the Habitat Ring and open its</text>
<text x="1080" y="672" class="muted" font-size="13">evacuation uplink after securing the</text>
<text x="1080" y="693" class="muted" font-size="13">residential wing.</text>
<text x="1040" y="730" fill="#f4cf7a" font-size="16">06</text>
<text x="1080" y="730" class="white" font-size="16" font-weight="700">Break the lockdown</text>
