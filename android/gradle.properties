# JVM tuning for LOW-MEMORY build machines. Flutter's default -Xmx8G OOM-kills
# the daemon on anything under ~10 GB (verified on a 2 GB host: the kernel
# killed it). These settings build here AND on large CI runners.
org.gradle.jvmargs=-Xmx1100m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=192m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseSerialGC
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=true
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
