include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Build-time tooling: standalone Dart scripts run with `dart run`, so they
    # legitimately use relative imports and print to stdout. Linting them as
    # app code produces noise that hides real findings.
    - tool/**

linter:
  rules:
    - prefer_const_constructors
    - avoid_print
