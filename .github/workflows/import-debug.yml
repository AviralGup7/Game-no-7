name: Import debug repro (temporary)

# TEMPORARY diagnostic workflow. The Actions log-download endpoint is
# unreachable from some environments, so this job reproduces the Android
# workflow's failing godot-tests steps verbatim on the pinned engine
# (4.4.1-stable) and commits every captured log back to the branch under
# docs/godot-runs/android-debug/ where they can be read anywhere.
# It also runs the previous headless invocation for comparison, so the
# regression (content vs. rendering mode) can be isolated.
# Remove this file once the Android workflow is green again.

on:
  push:
    branches: ["arena/**"]
    paths-ignore:
      - "docs/godot-runs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-debug-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GODOT_VERSION: "4.4.1-stable"

jobs:
  repro:
    name: Reproduce godot-tests import/test steps (4.4.1)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Isolate Godot test data
        run: echo "XDG_DATA_HOME=${RUNNER_TEMP}/last-stand-godot-tests" >> "$GITHUB_ENV"

      - name: Set up Godot ${{ env.GODOT_VERSION }}
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Install software renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils

      # Exact copy of the failing android.yml step.
      - name: Import project via run_godot.sh (xvfb + gl_compatibility)
        run: |
          set +e
          bash scripts/run_godot.sh --path . --import > godot-import.log 2>&1
          code=$?
          set -e
          echo "import exit: $code" | tee step-results.txt
          python3 tool/check_godot_log.py godot-import.log --exit-code "$code" > check-import.log 2>&1 || true
          tail -80 godot-import.log || true
          cat check-import.log || true
          true

      # Previous (green) invocation, same engine, for comparison.
      - name: Import project headless (old invocation)
        run: |
          set +e
          godot --headless --path . --import > godot-import-headless.log 2>&1
          code=$?
          set -e
          echo "import-headless exit: $code" | tee -a step-results.txt
          python3 tool/check_godot_log.py godot-import-headless.log --exit-code "$code" > check-import-headless.log 2>&1 || true
          cat check-import-headless.log || true
          true

      - name: Unit tests via run_godot.sh
        run: |
          set +e
          bash scripts/run_godot.sh --path . --script res://tests/run_tests.gd > godot-unit.log 2>&1
          code=$?
          set -e
          echo "unit exit: $code" | tee -a step-results.txt
          python3 tool/check_godot_log.py godot-unit.log --exit-code "$code" --allow-test-errors \
            --require '^GDScript tests: [1-9][0-9]* total, 0 failed$' > check-unit.log 2>&1 || true
          tail -40 godot-unit.log || true
          cat check-unit.log || true
          true

      - name: Unit tests headless (old invocation)
        run: |
          set +e
          godot --headless --path . --script res://tests/run_tests.gd > godot-unit-headless.log 2>&1
          code=$?
          set -e
          echo "unit-headless exit: $code" | tee -a step-results.txt
          true

      - name: Environment capture
        run: |
          {
            glxinfo -B 2>&1 || true
            godot --version 2>&1 || true
          } > gl-env.log 2>&1 || true

      - name: Publish logs to the branch
        if: always()
        run: |
          mkdir -p docs/godot-runs/android-debug
          for f in godot-import.log godot-import-headless.log godot-unit.log godot-unit-headless.log \
                   check-import.log check-import-headless.log check-unit.log step-results.txt gl-env.log; do
            cp -f "$f" docs/godot-runs/android-debug/ 2>/dev/null || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/godot-runs/android-debug
          if git diff --cached --quiet; then
            echo "no debug log changes"
          else
            git commit -q -m "debug: 4.4.1 import/unit repro logs [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          cat step-results.txt || true
