name: Import debug repro (temporary)

# TEMPORARY diagnostic workflow. Round 4: reproduce the entire build-android
# job (import -> build template -> gradle export -> APK verification + size
# report) and commit the validation report/logs back to the branch, because
# the Actions log endpoint is unreachable from some environments.
# Remove this file once the Android workflow is green on main.

on:
  push:
    branches: ["arena/**"]
    paths-ignore:
      - "docs/godot-runs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-debug-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GODOT_VERSION: "4.4.1-stable"
  APK_PATH: build/LastStandArena-debug.apk

jobs:
  apk-pipeline:
    name: build-android pipeline repro (4.4.1)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot ${{ env.GODOT_VERSION }}
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Verify Android export templates installed
        run: bash scripts/install_export_templates.sh

      - name: Set up JDK (Gradle Android export)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the pinned Godot Android SDK dependencies
        run: |
          set +e
          yes | sdkmanager --licenses > sdk-licenses.log 2>&1
          code=${PIPESTATUS[1]}
          set -e
          test "$code" -eq 0 || { cat sdk-licenses.log; exit "$code"; }
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Import project
        run: |
          set +e
          bash scripts/run_godot.sh --path . --import > dbg-import.log 2>&1
          code=$?
          set -e
          python3 tool/check_godot_log.py dbg-import.log --exit-code "$code" \
            --allow-engine-noise > check-import.log 2>&1 || true
          echo "import done (engine: $code)" | tee step-results.txt
          true

      - name: Install Android build template into project
        run: bash scripts/install_android_build_template.sh

      - name: Build Android APK (debug export)
        run: |
          mkdir -p build
          set +e
          bash scripts/run_godot.sh --path . --export-debug "Android" "$APK_PATH" 2>&1 | tee build/export.log
          code=${PIPESTATUS[0]}
          set -e
          echo "export exit: $code" | tee -a step-results.txt
          python3 tool/check_godot_log.py build/export.log --exit-code "$code" \
            --allow-engine-noise > check-export.log 2>&1 || true
          true

      - name: Verify APK + size report + raw aapt forensics
        if: always()
        run: |
          set +e
          python3 tool/check_android_apk.py "$APK_PATH" --build-type debug \
            --report build/apk-validation.json > check-apk.log 2>&1
          echo "apk verify: $?" | tee -a step-results.txt
          cat check-apk.log || true
          python3 tool/apk_size_report.py "$APK_PATH" > apk-size.txt 2>&1
          echo "size report: $?" | tee -a step-results.txt
          # Raw tool output so parse-level checker bugs are diagnosable from
          # the committed logs without re-running the pipeline.
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          "$AAPT" dump badging "$APK_PATH" > aapt-badging.txt 2>&1
          echo "aapt badging: $?" | tee -a step-results.txt
          "$AAPT" dump xmltree --file AndroidManifest.xml "$APK_PATH" > aapt-xmltree.txt 2>&1
          echo "aapt xmltree: $?" | tee -a step-results.txt
          unzip -l "$APK_PATH" > apk-entries.txt 2>&1
          echo "APK permissions line:" | tee apk-perms.txt
          grep "^uses-permission" aapt-badging.txt >> apk-perms.txt 2>&1 || true
          set -e
          true

      - name: Publish logs to the branch
        if: always()
        run: |
          mkdir -p docs/godot-runs/android-debug
          rm -f docs/godot-runs/android-debug/*
          for f in dbg-import.log check-import.log check-export.log check-apk.log \
                   step-results.txt apk-size.txt aapt-badging.txt aapt-xmltree.txt \
                   apk-entries.txt apk-perms.txt build/export.log \
                   build/apk-validation.json; do
            cp -f "$f" docs/godot-runs/android-debug/ 2>/dev/null || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/godot-runs/android-debug
          if git diff --cached --quiet; then
            echo "no debug log changes"
          else
            git commit -q -m "debug: apk pipeline repro logs [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          cat step-results.txt || true
