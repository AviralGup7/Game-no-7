name: Import debug repro (temporary)

# TEMPORARY diagnostic workflow. Round 3: verify the native-gate repair by
# running the remaining godot-tests steps (hero runtime, UI validation,
# campaign validation, asset imports) through the FIXED scripts, capturing
# their logs + gate verdicts back to docs/godot-runs/android-debug/ (the
# Actions log endpoint is unreachable from some environments).
# Remove this file once the Android workflow is green on main.

on:
  push:
    branches: ["arena/**"]
    paths-ignore:
      - "docs/godot-runs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-debug-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GODOT_VERSION: "4.4.1-stable"

jobs:
  repro:
    name: Verify native steps after gate repair (4.4.1)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Isolate Godot test data
        run: echo "XDG_DATA_HOME=${RUNNER_TEMP}/last-stand-godot-tests" >> "$GITHUB_ENV"

      - name: Set up Godot ${{ env.GODOT_VERSION }}
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Install software renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Import project (fixed routing)
        run: |
          set +e
          bash scripts/run_godot.sh --path . --import > dbg-import.log 2>&1
          code=$?
          set -e
          python3 tool/check_godot_log.py dbg-import.log --exit-code "$code" > check-import.log 2>&1
          echo "import gate: $? (engine: $code)" | tee step-results.txt
          true

      - name: Unit tests (fixed gates)
        run: |
          set +e
          bash scripts/run_godot.sh --path . --script res://tests/run_tests.gd > dbg-unit.log 2>&1
          code=$?
          set -e
          python3 tool/check_godot_log.py dbg-unit.log --exit-code "$code" --allow-test-errors \
            --allow-engine-noise \
            --require '^GDScript tests: [1-9][0-9]* total, 0 failed$' > check-unit.log 2>&1
          echo "unit gate: $? (engine: $code)" | tee -a step-results.txt
          true

      - name: Asset imports (fixed gates)
        run: |
          set +e
          bash scripts/run_godot.sh --path . --script res://tests/validate_asset_imports.gd > dbg-assets.log 2>&1
          code=$?
          set -e
          python3 tool/check_godot_log.py dbg-assets.log --exit-code "$code" \
            --allow-engine-noise \
            --require '^Asset imports: [1-9][0-9]* resources, 0 failures$' > check-assets.log 2>&1
          echo "assets gate: $? (engine: $code)" | tee -a step-results.txt
          true

      - name: Hero runtime (fixed wrapper)
        run: |
          set +e
          GODOT_BIN="$(command -v godot)" bash tool/test_hero_runtime.sh > dbg-hero.log 2>&1
          echo "hero wrapper: $?" | tee -a step-results.txt
          set -e
          true

      - name: UI validation (fixed wrapper)
        run: |
          set +e
          GODOT_BIN="$(command -v godot)" bash scripts/ui/run_ui_validation.sh > dbg-ui.log 2>&1
          echo "ui wrapper: $?" | tee -a step-results.txt
          set -e
          true

      - name: Campaign validation (fixed wrapper)
        run: |
          set +e
          GODOT_BIN="$(command -v godot)" bash scripts/run_campaign_validation.sh > dbg-campaign.log 2>&1
          echo "campaign wrapper: $?" | tee -a step-results.txt
          set -e
          true

      - name: Publish logs to the branch
        if: always()
        run: |
          mkdir -p docs/godot-runs/android-debug
          rm -f docs/godot-runs/android-debug/*
          for f in dbg-*.log check-*.log step-results.txt \
                   build/hero-runtime-tests.log build/ui-import.log \
                   build/ui-tests-fresh.log build/ui-tests-existing.log \
                   build/campaign-import.log build/campaign-tests.log; do
            base="$(basename "$f")"
            case "$base" in ui-*.log) base="build-$base";; esac
            cp -f "$f" "docs/godot-runs/android-debug/$base" 2>/dev/null || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/godot-runs/android-debug
          if git diff --cached --quiet; then
            echo "no debug log changes"
          else
            git commit -q -m "debug: native gate repair verification logs [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          cat step-results.txt || true
