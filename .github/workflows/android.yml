name: Android build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "docs/godot-runs/**"
  pull_request:
    paths-ignore:
      - "docs/godot-runs/**"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release version (for example v0.4.0)"
        required: true
        type: string
  # Build + publish the APK whenever a Release is published from the GitHub UI
  # (event_name == 'release'; publish-release also handles tag pushes and manual dispatch).
  release:
    types: [published]

permissions:
  contents: read

# Cancel overlapping PR runs. Do not cancel on push: every push must produce
# an APK (or a real export failure), not a skipped/cancelled Build Android job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  GODOT_VERSION: "4.4.1-stable"
  APK_PATH: build/LastStandArena-debug.apk
  ADB_SERVER_SOCKET: "tcp:127.0.0.1:5037"

# ---------------------------------------------------------------------------
# Split pipeline (was one monolith job `build-android`):
#
#  1) validate-resources  — fast, no Godot: resource + asset + Python tests
#  2) godot-tests         — Godot import + native GDScript tests + import checks
#  3) build-android       — heavy: JDK + Android SDK + build template + APK export
#
#  validate-* and godot-tests run in parallel; build-android still *needs*
#  both so the graph is intact, but it runs whenever validate-resources is
#  green (a native-suite failure still produces a diagnostic APK). Publishing
#  requires ALL validation jobs to succeed; a diagnostic APK is never a release.
# ---------------------------------------------------------------------------

jobs:
  # ---- Stage 1a: static / offline validation (fast, no Godot) ----------------
  validate-resources:
    name: Validate resources & Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Godot resources (load_steps, missing paths)
        shell: bash
        run: python3 tool/validate_resources.py

      - name: Verify locked assets (offline checksums)
        shell: bash
        run: python3 scripts/download_assets.py --verify

      - name: Validate asset formats & inventory
        shell: bash
        run: python3 tool/validate_assets.py

      # Engine-API contract gate: every typed member access, global call and
      # .tscn/.tres property is checked against the pinned engine's own ClassDB
      # (tool/godot_api_manifest.json, reduced from the GODOT_VERSION source
      # tag). Catches the phantom-member defect class offline — the class that
      # shipped five times before it existed (see CHANGELOG.md / the gate's
      # docstring). Hermetic: stdlib-only, no Godot binary, no network.
      - name: Authored campaign topology and content
        run: python3 tool/validate_campaign.py

      - name: Engine API contract gate
        shell: bash
        run: python3 tool/check_engine_api.py

      # Scene-path contract gate: every string-literal get_node / NodePath
      # property is resolved against the actual .tscn node trees (plus
      # runtime `.name =` assignments and autoloads), and `as` casts after
      # scene-resolved lookups are checked against the declared node class.
      # Catches renamed/removed nodes offline — a runtime-error class no
      # syntax gate can see. Hermetic: stdlib-only, no Godot binary.
      - name: Scene path contract gate
        shell: bash
        run: python3 tool/check_scene_paths.py

      # String-format contract gate: every `"..." %` use is checked against
      # the 4.4.1-stable String::sprintf rules (placeholder syntax, exact
      # array arity, scalar wrapping, literal types). A mismatch is a runtime
      # ERROR in the engine. Hermetic: stdlib-only, no Godot binary.
      - name: String format contract gate
        shell: bash
        run: python3 tool/check_string_formats.py

      # Signal contract gate: every signal name and emit arity is resolved
      # against the declaring classes (self chains, autoloads, engine signals
      # from tool/godot_api_manifest.json) and connected callables are
      # checked for parameter compatibility. A phantom signal or wrong arity
      # is a runtime error in the engine. Hermetic: stdlib-only.
      - name: Signal contract gate
        shell: bash
        run: python3 tool/check_signals.py

      - name: GDScript lint and architecture guards
        run: |
          python3 -m pip install gdtoolkit==4.3.4
          gdlint scripts tests
          python3 tool/check_typed_arch.py
          python3 tool/validate_guards.py

      - name: Python unit tests (incl. regression guards)
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests/python -v 2>&1 | tee python-tests.log

      - name: Upload reports (validate-resources)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-validate-resources
          path: |
            build/
            *.log
          if-no-files-found: ignore
          retention-days: 14

  # ---- Stage 1b: native Godot tests (software renderer; no physical display) ---
  godot-tests:
    name: Godot host regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner context is unavailable in job-level env expressions.
      # Set the isolated profile at runtime for all subsequent native steps.
      - name: Isolate Godot test data
        run: echo "XDG_DATA_HOME=${RUNNER_TEMP}/last-stand-godot-tests" >> "$GITHUB_ENV"

      - name: Set up Godot ${{ env.GODOT_VERSION }}
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Install software renderer for native checks
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Import project (godot --import)
        run: |
          set +e
          bash scripts/run_godot.sh --path . --import > godot-import.log 2>&1
          code=$?
          set -e
          tail -60 godot-import.log
          # Import is headless; the only demoted pair is the dummy renderer's
          # null-texture fetch while generating GLB/GLTF preview thumbnails.
          python3 tool/check_godot_log.py godot-import.log --exit-code "$code" \
            --allow-engine-noise

      # The unittest suite runs native (xvfb + Mesa GL). --allow-engine-noise
      # only demotes the enumerated GLES3/driver lifecycle reports that a
      # real GL driver emits at scene teardown / process exit; script and
      # engine errors that reference res:// still fail the step.
      - name: Run native unit tests
        run: |
          set +e
          bash scripts/run_godot.sh --path . --script res://tests/run_tests.gd > godot-unit.log 2>&1
          code=$?
          set -e
          tail -120 godot-unit.log
          python3 tool/check_godot_log.py godot-unit.log --exit-code "$code" --allow-test-errors \
            --allow-engine-noise \
            --require '^GDScript tests: [1-9][0-9]* total, 0 failed$'

      - name: Validate hero combat clips, sockets and lifecycle
        shell: bash
        run: bash tool/test_hero_runtime.sh

      # Real-node UI suite (screens, navigation, and the UiLayout geometry
      # contract across Android resolutions / text scales). It was previously
      # never invoked by CI, so UI regressions could land unnoticed.
      # The script isolates save data into a disposable profile.
      - name: Run native UI validation
        shell: bash
        run: bash scripts/ui/run_ui_validation.sh

      - name: UI validation failure details
        if: failure()
        shell: bash
        run: |
          for f in build/ui-tests-*.log; do
            [ -f "$f" ] || continue
            grep -hE '(UI FAIL:|SCRIPT ERROR:|Parse Error:)' "$f" \
              | tr -d '\r' | sed 's/[[:space:]]\+/ /g' | sort -u | head -40 \
              | while IFS= read -r line; do
                  echo "::error title=UI validation::${line}"
                done
          done

      - name: Validate shipping campaign and checkpoint flow
        shell: bash
        run: bash scripts/run_campaign_validation.sh

      - name: Validate imported 3D assets, animations, textures and audio
        shell: bash
        run: |
          set +e
          bash scripts/run_godot.sh --path . --script res://tests/validate_asset_imports.gd > godot-assets.log 2>&1
          code=$?
          set -e
          tail -60 godot-assets.log
          python3 tool/check_godot_log.py godot-assets.log --exit-code "$code" \
            --allow-engine-noise \
            --require '^Asset imports: [1-9][0-9]* resources, 0 failures$'

      - name: Upload reports (godot-tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-godot-tests
          path: |
            build/
            .godot/
            *.log
          if-no-files-found: ignore
          retention-days: 14

  # ---- Stage 2: heavy Android build ------------------------------------------
  # needs: both prior jobs so the graph stays a three-stage pipeline.
  # if: always() + validate-resources success so a godot-tests failure cannot
  # skip the APK on push (GitHub skips dependent jobs when a needed job fails).
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [validate-resources, godot-tests]
    if: ${{ always() && needs.validate-resources.result == 'success' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot ${{ env.GODOT_VERSION }}
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Verify Android export templates installed
        shell: bash
        run: bash scripts/install_export_templates.sh

      # Godot 4.x Android export uses a Gradle build that requires a JDK.
      - name: Set up JDK (Gradle Android export)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the pinned Godot Android SDK dependencies
        shell: bash
        run: |
          # Godot 4.4.1's template pins compileSdk/build-tools 34 and Java 17.
          # Check sdkmanager's status, not the harmless SIGPIPE from `yes`.
          set +e
          yes | sdkmanager --licenses > sdk-licenses.log 2>&1
          code=${PIPESTATUS[1]}
          set -e
          test "$code" -eq 0 || { cat sdk-licenses.log; exit "$code"; }
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install software renderer for host import only
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Import project
        run: |
          set +e
          bash scripts/run_godot.sh --path . --import > godot-import.log 2>&1
          code=$?
          set -e
          tail -60 godot-import.log
          python3 tool/check_godot_log.py godot-import.log --exit-code "$code" \
            --allow-engine-noise

      # Gradle Android export requires the build template inside the project.
      - name: Install Android build template into project
        shell: bash
        run: bash scripts/install_android_build_template.sh

      - name: Build Android APK (debug export for validation artifact)
        shell: bash
        run: |
          mkdir -p build
          echo "HOME=$HOME"
          echo "godot templates dir: $HOME/.local/share/godot/export_templates"
          find "$HOME/.local/share/godot/export_templates" -maxdepth 2 -type f | head -40 || true
          set +e
          bash scripts/run_godot.sh --path . --export-debug "Android" "$APK_PATH" 2>&1 | tee build/export.log
          code=${PIPESTATUS[0]}
          set -e
          echo "--- godot export log (tail) ---"
          tail -80 build/export.log || true
          if [ "$code" -ne 0 ]; then
            printf '::error file=build/export.log,title=godot export failed::'
            grep -iE "ERROR:|error:|failed|denied|not found|Exception|Could not|FAILURE:|What went wrong" build/export.log | head -25
          fi
          # The editor exporter can print the same exit-time driver reports the
          # native test steps see; only those enumerated pairs are demoted.
          python3 tool/check_godot_log.py build/export.log --exit-code "$code" \
            --allow-engine-noise

      - name: Verify Android APK identity, ABI, permissions and signature
        run: |
          python3 tool/check_android_apk.py "$APK_PATH" --build-type debug \
            --report build/apk-validation.json

      - name: Report APK size by container and largest entries
        run: python3 tool/apk_size_report.py "$APK_PATH" | tee build/apk-size-report.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LastStandArena-android
          path: |
            ${{ env.APK_PATH }}
            build/apk-size-report.json
            build/apk-validation.json
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Android build"
            echo
            printf -- '- Godot: `%s`\n' "$GODOT_VERSION"
            printf -- '- APK path: `%s`\n' "$APK_PATH"
            if [ -s "$APK_PATH" ]; then
              printf -- '- APK size: `%s bytes`\n' "$(stat -c%s "$APK_PATH")"
            else
              echo "- APK was not produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports (build)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-build-android
          path: |
            build/
            *.log
          if-no-files-found: ignore
          retention-days: 14

  # ---- Stage 3: publish (only when a Release is cut / workflow_dispatch) ----
  # Diagnostic APKs may build after a test failure; they must never be published.
  # Require all three jobs, not just the (deliberately permissive) build job.
  # This is a debug-signed milestone, not a Play-ready production build.
  # Fix: `release` events (GitHub UI → Publish release) have event_name == 'release',
  # not a tag ref, so the previous `workflow_dispatch || tags` check skipped them.
  publish-release:
    if: >-
      (github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'release')
      && needs.validate-resources.result == 'success'
      && needs.godot-tests.result == 'success'
      && needs.build-android.result == 'success'
    needs: [validate-resources, godot-tests, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated APK
        uses: actions/download-artifact@v4
        with:
          name: LastStandArena-android
          path: build

      - name: Verify APK and generate checksum
        shell: bash
        run: |
          test -s "$APK_PATH"
          unzip -t "$APK_PATH"
          cd build
          sha256sum LastStandArena-debug.apk > SHA256SUMS.txt

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
          files: |
            build/LastStandArena-debug.apk
            build/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body: |
            Android ARM64 milestone for Last Stand: Arena.

            **Debug-signed APK for sideloading/testing; not a Google Play production release.**

            Published from the exact commit validated by this workflow: native unit tests,
            native asset import checks, resource/asset validation, Python tests and Android export.
            SHA256SUMS.txt contains the APK checksum.
          generate_release_notes: true
