name: Android build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release version (for example v0.4.0)"
        required: true
        type: string
  # Build + publish the APK whenever a Release is published from the GitHub UI
  # (event_name == 'release'; publish-release also handles tag pushes and manual dispatch).
  release:
    types: [published]

env:
  GODOT_VERSION: "4.4.1-stable"
  APK_PATH: build/LastStandArena-debug.apk

# ---------------------------------------------------------------------------
# Split pipeline (was one monolith job `build-android`):
#
#  1) validate-resources  — fast, no Godot: resource + asset + Python tests
#  2) godot-tests         — Godot import + headless GDScript tests + import checks
#  3) build-android       — heavy: JDK + Android SDK + build template + APK export
#
#  validate-* run in parallel; build needs both; publish needs build.
#  Each stage uploads its own reports so failures are trivial to bisect.
# ---------------------------------------------------------------------------

jobs:
  # ---- Stage 1a: static / offline validation (fast, no Godot) ----------------
  validate-resources:
    name: Validate resources & Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Godot resources (load_steps, missing paths)
        shell: bash
        run: python3 tool/validate_resources.py

      - name: Verify locked assets (offline checksums)
        shell: bash
        run: python3 scripts/download_assets.py --verify

      - name: Validate asset formats & inventory
        shell: bash
        run: python3 tool/validate_assets.py

      - name: Python unit tests (incl. regression guards)
        shell: bash
        run: python3 -m unittest discover -s tests/python -v

      - name: Upload reports (validate-resources)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-validate-resources
          path: |
            build/
            *.log
          if-no-files-found: ignore

  # ---- Stage 1b: Godot headless tests (needs import) -------------------------
  godot-tests:
    name: Godot headless tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot ${{ env.GODOT_VERSION }}
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Verify Android export templates installed
        shell: bash
        run: bash scripts/install_export_templates.sh

      - name: Import project (godot --import)
        shell: bash
        run: godot --headless --path . --import

      - name: Run headless unit tests
        shell: bash
        run: godot --headless --path . --script res://tests/run_tests.gd

      - name: Validate imported 3D assets, animations, textures and audio
        shell: bash
        run: godot --headless --path . --script res://tests/validate_asset_imports.gd

      - name: Upload reports (godot-tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-godot-tests
          path: |
            build/
            .godot/
            *.log
          if-no-files-found: ignore

  # ---- Stage 2: heavy Android build (needs both validations green) ------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [validate-resources, godot-tests]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot ${{ env.GODOT_VERSION }}
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Verify Android export templates installed
        shell: bash
        run: bash scripts/install_export_templates.sh

      # Godot 4.x Android export uses a Gradle build that requires a JDK.
      - name: Set up JDK (Gradle Android export)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Import project
        shell: bash
        run: godot --headless --path . --import

      # Gradle Android export requires the build template inside the project.
      - name: Install Android build template into project
        shell: bash
        run: bash scripts/install_android_build_template.sh

      - name: Build Android APK (debug export for validation artifact)
        shell: bash
        run: |
          mkdir -p build
          echo "HOME=$HOME"
          echo "godot templates dir: $HOME/.local/share/godot/export_templates"
          find "$HOME/.local/share/godot/export_templates" -maxdepth 2 -type f | head -40 || true
          set +e
          godot --headless --path . --export-debug "Android" "$APK_PATH" 2>&1 | tee build/export.log
          code=${PIPESTATUS[0]}
          set -e
          echo "--- godot export log (tail) ---"
          tail -80 build/export.log || true
          if [ "$code" -ne 0 ]; then
            printf '::error file=build/export.log,title=godot export failed::'
            grep -iE "ERROR:|error:|failed|denied|not found|Exception|Could not|FAILURE:|What went wrong" build/export.log | head -25
          fi
          exit "$code"

      - name: Verify APK exists and is non-zero
        shell: bash
        run: |
          test -f "$APK_PATH" && test -s "$APK_PATH"
          echo "APK size: $(stat -c%s "$APK_PATH") bytes"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LastStandArena-android
          path: ${{ env.APK_PATH }}

      - name: Upload reports (build)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-build-android
          path: |
            build/
            *.log
          if-no-files-found: ignore

  # ---- Stage 3: publish (only when a Release is cut / workflow_dispatch) ----
  # Publish only the APK produced by the successful validation/build job.
  # This is a debug-signed milestone, not a Play-ready production build.
  # Fix: `release` events (GitHub UI → Publish release) have event_name == 'release',
  # not a tag ref, so the previous `workflow_dispatch || tags` check skipped them.
  publish-release:
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'release'
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated APK
        uses: actions/download-artifact@v4
        with:
          name: LastStandArena-android
          path: build

      - name: Verify APK and generate checksum
        shell: bash
        run: |
          test -s "$APK_PATH"
          unzip -t "$APK_PATH"
          cd build
          sha256sum LastStandArena-debug.apk > SHA256SUMS.txt

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
          files: |
            build/LastStandArena-debug.apk
            build/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body: |
            Android ARM64 milestone for Last Stand: Arena.

            **Debug-signed APK for sideloading/testing; not a Google Play production release.**

            Published from the exact commit validated by this workflow: headless unit tests,
            native asset import checks, resource/asset validation, Python tests and Android export.
            SHA256SUMS.txt contains the APK checksum.
          generate_release_notes: true
